[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-log-analyzer"
version = "1.0.0"
description = "Python-based security log analyzer for detecting suspicious authentication activity."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
seclog = "seclog.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 90
